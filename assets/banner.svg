<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Effects -->
    <radialGradient id="glowCyan" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dynamic Flow Pipeline Animations -->
    <style>
      @keyframes pulseLine {
        0% { stroke-dashoffset: 100; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { r: 18px; opacity: 0.6; }
        50% { r: 24px; opacity: 0.9; }
      }
      .flow-line {
        stroke-dasharray: 12 8;
        animation: pulseLine 6s linear infinite;
      }
      .node-1 { animation: floatNode 4s ease-in-out infinite; }
      .node-2 { animation: floatNode 5s ease-in-out infinite 1s; }
      .node-3 { animation: floatNode 4.5s ease-in-out infinite 0.5s; }
      .pulse-circle { animation: pulseGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#glowCyan)"/>
  <rect width="1200" height="400" fill="url(#glowPurple)"/>

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Dynamic Pipeline Visualizations (Background Decorator) -->
  <g opacity="0.4">
    <!-- Pipeline Connection Paths -->
    <path d="M 100,330 Q 300,280 500,340 T 900,300 T 1100,350" fill="none" stroke="#38bdf8" stroke-width="3" class="flow-line"/>
    <path d="M 50,70 Q 250,120 450,60 T 850,100 T 1150,50" fill="none" stroke="#a855f7" stroke-width="3" class="flow-line"/>

    <!-- Nodes -->
    <g class="node-1">
      <circle cx="150" cy="315" r="18" fill="#0284c7" class="pulse-circle"/>
      <circle cx="150" cy="315" r="8" fill="#38bdf8"/>
    </g>
    <g class="node-2">
      <circle cx="950" cy="295" r="18" fill="#7c3aed" class="pulse-circle"/>
      <circle cx="950" cy="295" r="8" fill="#c084fc"/>
    </g>
    <g class="node-3">
      <circle cx="1050" cy="70" r="18" fill="#059669" class="pulse-circle"/>
      <circle cx="1050" cy="70" r="8" fill="#34d399"/>
    </g>
  </g>

  <!-- Main Card Container / Border -->
  <rect x="40" y="30" width="1120" height="340" rx="20" fill="#0f172a" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Title and Subtitle (Guaranteed High Contrast & Readability) -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 85)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">DATA ECOSYSTEM GUIDE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#shadowGlow)">
      Awesome Data Pipeline Observability
    </text>

    <!-- Subtitle -->
    <text x="600" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated List of SaaS Products &amp; Open-Source Tools for Data Reliability, Anomaly Detection &amp; Quality Monitoring
    </text>

    <!-- Decorative Status Indicators / Feature Tags -->
    <g transform="translate(600, 290)">
      <!-- Tag 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="-55" cy="0" r="4" fill="#10b981"/>
        <text x="5" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SaaS &amp; Open Source</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="-55" cy="0" r="4" fill="#06b6d4"/>
        <text x="5" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Freshness &amp; Lineage</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(240, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="-55" cy="0" r="4" fill="#a855f7"/>
        <text x="5" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Anomaly Detection</text>
      </g>
    </g>
  </g>
</svg>
